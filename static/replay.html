<style type="text/tailwindcss">
  @layer components {
    .card { @apply rounded-xl border border-zinc-200 bg-white shadow-sm dark:border-zinc-800 dark:bg-zinc-900/70 dark:shadow-none; }
    .card-h { @apply flex items-center justify-between gap-3 border-b border-zinc-200 px-4 py-3 dark:border-zinc-800; }
    .card-t { @apply text-sm font-semibold text-zinc-900 dark:text-zinc-100; }
    .btn { @apply inline-flex items-center justify-center gap-1.5 rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm font-medium text-zinc-800 transition hover:bg-zinc-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:hover:bg-zinc-800; }
    .btn-primary { @apply border-accent bg-accent text-zinc-950 hover:bg-accent-soft dark:border-accent dark:bg-accent dark:text-zinc-950 dark:hover:bg-accent-soft; }
    .btn-sm { @apply px-2 py-1 text-xs; }
    .input { @apply w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-100; }
    .muted { @apply text-zinc-500 dark:text-zinc-400; }
    .badge { @apply inline-flex items-center gap-1 whitespace-nowrap rounded-md border px-1.5 py-0.5 text-[11px] font-medium leading-4; }
    .b-gray { @apply border-zinc-300 bg-zinc-100 text-zinc-700 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-300; }
    .b-amber { @apply border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300; }
    .b-red { @apply border-red-300 bg-red-50 text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300; }
    .b-green { @apply border-lime-300 bg-lime-50 text-lime-800 dark:border-accent/30 dark:bg-accent/10 dark:text-accent-soft; }
    .b-violet { @apply border-violet-300 bg-violet-50 text-violet-800 dark:border-violet-400/30 dark:bg-violet-400/10 dark:text-violet-300; }
    .b-sky { @apply border-sky-300 bg-sky-50 text-sky-800 dark:border-sky-400/30 dark:bg-sky-400/10 dark:text-sky-300; }
    .seg { @apply inline-flex rounded-lg border border-zinc-300 p-0.5 dark:border-zinc-700; }
    .seg button { @apply rounded-md px-2.5 py-1 text-xs font-medium text-zinc-600 dark:text-zinc-400; }
    .seg button.on { @apply bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900; }
    .sec { @apply border-b border-zinc-200 px-5 py-3.5 last:border-b-0 dark:border-zinc-800; }
    .sec-head { display: inline-flex; align-items: center; gap: 10px; }
    .sec-name { font-size: 13px; font-weight: 800; letter-spacing: .09em; color: #18181b; line-height: 1;
                text-decoration: underline; text-decoration-color: #76b900; text-decoration-thickness: 2px;
                text-underline-offset: 3px; }
    .dark .sec-name { color: #f4f4f5; }
    .sec-t { @apply mb-2 flex items-center justify-between gap-2 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400; }
    .chip { @apply inline-flex max-w-full items-center gap-1.5 rounded-md border border-zinc-300 bg-zinc-50 px-2 py-1 font-mono text-[12.5px] dark:border-zinc-700 dark:bg-zinc-950; }
    .bub-c { @apply max-w-[88%] rounded-2xl rounded-br-md bg-zinc-900 px-4 py-3 text-[15px] leading-relaxed text-white dark:bg-zinc-100 dark:text-zinc-900; }
    .bub-a { @apply max-w-[88%] rounded-2xl rounded-bl-md border border-zinc-200 bg-white px-4 py-3 text-[15px] leading-relaxed text-zinc-900 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-100; }
    .track { @apply h-1.5 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800; }
    /* who did the work: same palette in chat.html */
    .w-nano { @apply border-lime-300 bg-lime-50 text-lime-800 dark:border-accent/30 dark:bg-accent/10 dark:text-accent-soft; }
    .w-super { @apply border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-400/30 dark:bg-amber-400/10 dark:text-amber-300; }
    .w-ultra { @apply border-violet-300 bg-violet-50 text-violet-800 dark:border-violet-400/30 dark:bg-violet-400/10 dark:text-violet-300; }
    .w-vision { @apply border-pink-300 bg-pink-50 text-pink-800 dark:border-pink-400/30 dark:bg-pink-400/10 dark:text-pink-300; }
    .w-rules { @apply border-blue-300 bg-blue-50 text-blue-800 dark:border-blue-400/30 dark:bg-blue-400/10 dark:text-blue-300; }
    .w-store { @apply border-sky-300 bg-sky-50 text-sky-800 dark:border-sky-400/30 dark:bg-sky-400/10 dark:text-sky-300; }
    .legend { @apply flex flex-wrap gap-x-3 gap-y-1 border-b border-zinc-200 px-5 py-2 text-[11px] text-zinc-500 dark:border-zinc-800 dark:text-zinc-400; }
    .legend > span { @apply inline-flex items-center gap-1.5; }
    .step { @apply rounded bg-zinc-200 px-1 font-mono text-[10px] font-medium normal-case tracking-normal text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400; }
  }
  .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 9999px; background: currentColor !important; }
  [hidden] { display: none !important; }
  body { font-feature-settings: "cv11", "ss01"; --k: 1; }
  :focus-visible { outline: 2px solid #76b900; outline-offset: 2px; }
  @keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } }
  @keyframes slide-l { from { opacity: 0; transform: translateX(28px) } }
  @keyframes slide-r { from { opacity: 0; transform: translateX(-28px) } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6) } 70% { transform: scale(1.08) } 100% { transform: scale(1) } }
  @keyframes blink { 50% { opacity: 0 } }
  .pulse { animation: pulse-dot 1.4s ease-in-out infinite; }
  .rise { animation: rise calc(.45s * var(--k)) ease-out both; }
  .slide-l { animation: slide-l calc(.5s * var(--k)) cubic-bezier(.2,.8,.2,1) both; }
  .slide-r { animation: slide-r calc(.5s * var(--k)) cubic-bezier(.2,.8,.2,1) both; }
  .pop { animation: pop calc(.35s * var(--k)) ease-out both; }
  .fill { transition: width calc(.9s * var(--k)) cubic-bezier(.2,.8,.2,1); }
  .caret::after { content: '▍'; margin-left: 1px; color: #76b900; animation: blink 1s steps(1) infinite; }
  .paused * { animation-play-state: paused !important; }
  html:fullscreen #hdr { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (min-width: 1024px) { .stage { height: calc(100vh - var(--hdr, 4rem)); } }
</style>
<style id="light-contrast">

html:not(.dark) .border-zinc-300, html:not(.dark) .border-gray-300, html:not(.dark) .border-slate-300 { border-color: #a7afba; }

<body class="bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">

<header id="hdr" class="sticky top-0 z-30 border-b border-zinc-200 bg-white/80 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/80">

        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg>
      </span>

<main id="stage" class="stage mx-auto grid max-w-[1920px] min-w-0 grid-cols-[minmax(0,1fr)] gap-4 p-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:gap-6 lg:p-6">

    <div id="foot" class="flex min-h-[3rem] items-center justify-center border-t border-zinc-200 bg-zinc-50 px-4 py-2.5 font-mono text-sm dark:border-zinc-800 dark:bg-black/20"></div>
  </aside>
</main>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const pct = v => num(v) == null ? '—' : Math.round(Number(v) * 100) + '%';
const short = v => typeof v === 'string' ? v : JSON.stringify(v);
const safeUrl = u => /^(https?:\/\/|\/(?!\/)|data:image\/)/i.test(String(u || '')) ? String(u) : null;
function money(v) {
  v = num(v); if (v == null) return null;
  const a = Math.abs(v); if (a === 0) return '$0.00';
  return '$' + (a < 0.0001 ? a.toPrecision(2) : a.toFixed(4));
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const KIOSK = true; // embed mode: no controls, 3 random conversations on a loop
if (KIOSK) $('#hdr').hidden = true;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (DEMO) $('#demoBadge').classList.remove('hidden');

// ---------- theme / fullscreen / header height ----------
const isDark = () => document.documentElement.classList.contains('dark');
function paintTheme() {
  $('#themeBtn').innerHTML = isDark()
    ? '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
}
$('#themeBtn').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); store.set('theme', isDark() ? 'dark' : 'light'); paintTheme(); });
// Follow theme changes made on the page that embeds us (same origin: the browser fires 'storage' in other documents)
window.addEventListener('storage', e => {
  if (e.key !== 'theme' || !e.newValue) return;
  document.documentElement.classList.toggle('dark', e.newValue === 'dark');
  paintTheme();
});
paintTheme();
const fitHdr = () => document.body.style.setProperty('--hdr', (document.fullscreenElement ? 0 : $('#hdr').offsetHeight) + 'px');
addEventListener('resize', fitHdr); document.addEventListener('fullscreenchange', fitHdr); fitHdr();
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
$('#fsBtn').addEventListener('click', toggleFs);

// ---------- player state + clock ----------
const S = { data: null, items: [], idx: 0, speed: 1, paused: false, done: false, auto: KIOSK || Q.get('autoplay') === '1', gen: 0 };
const STOP = Symbol('stop');
// wait `ms` of 1x time; honours pause + speed; rejects if a newer play started
function wait(ms, g) {
  if (g !== S.gen) return Promise.reject(STOP);
  if (RM) return Promise.resolve();
  return new Promise((ok, bad) => {
    let left = ms, last = performance.now();
    (function tick() {
      if (g !== S.gen) return bad(STOP);
      const now = performance.now();
      if (!S.paused) left -= (now - last) * S.speed;
      last = now;
      left <= 0 ? ok() : setTimeout(tick, 16);
    })();
  });
}

// ---------- builders ----------
// who did the work -> [color class, label]; same block in chat.html
const WHO = { nano: ['w-nano', 'Nano'], super: ['w-super', 'Super'], ultra: ['w-ultra', 'Ultra'], vision: ['w-vision', 'Vision'], code: ['w-rules', 'Rules engine'], store: ['w-store', 'Store record'] };
function whoKey(b) {
  const s = String(b || '').toLowerCase();
  if (s === 'code' || s === 'regex' || s === 'rules') return 'code';
  if (s === 'store') return 'store';
  if (/vl\b|vision/.test(s)) return 'vision';
  for (const k of ['ultra', 'super', 'nano']) if (s.includes(k)) return k;
  return s === 'vote' ? 'nano' : null;
}
function byLabel(b, ctx) {
  const k = whoKey(b);
  if (k === 'code' && ctx === 'field') return 'Exact match';
  if (/vote/i.test(b)) return 'Nano ×3 vote';
  if (/x3/i.test(b)) return 'Nano ×3 drafts + merge';
  return k ? WHO[k][1] : String(b);
}
const byBadge = (b, ctx) => b ? `<span class="badge font-sans ${WHO[whoKey(b)]?.[0] || 'b-gray'}">${esc(byLabel(b, ctx))}</span>` : '';
// ponytail: phrase heuristic for "sources don't cover it"; switch to a backend flag (found:false) when it exists
const NO_ANS = /(\bnot\b|n't|\bno\b).{0,40}(cover|mention|contain|answer|information|found|say)/i;
const TAVILY = '<span class="badge rounded-full b-gray font-sans normal-case tracking-normal">Tavily</span>';
function lookupHtml(l) {
  const src = (Array.isArray(l.sources) ? l.sources : []).map(z => isObj(z) ? { url: safeUrl(z.url ?? z.href), title: z.title ?? z.url } : { url: safeUrl(z), title: z }).filter(z => z.url && /^https?:/i.test(z.url));
  const miss = l.found === false || !l.answer || NO_ANS.test(l.answer);
  return `<div class="mb-1 text-xs font-semibold">Sources from Tavily</div>${l.query ? `<div class="text-xs muted">searched <span class="font-mono">“${esc(l.query)}”</span></div>` : ''}${miss
    ? `<div class="mt-1 text-sm italic muted">Tavily found no answer on the brand's site</div>` : `<div class="mt-1 text-sm">${esc(l.answer)}</div>`}${src.length ? `<ul class="mt-1.5 space-y-0.5 text-xs">${src.map(z =>
    `<li class="truncate"><a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer" class="text-accent-dim hover:underline dark:text-accent">${esc(z.title)}</a></li>`).join('')}</ul>` : ''}`;
}
const planCls = s => ({ ok: 'b-green', need_info: 'b-gray', escalate: 'b-violet', deny: 'b-red' }[s] || 'b-gray');
const PLAN_LABEL = { ok: 'resolved', need_info: 'asked customer', escalate: 'to a person', deny: 'declined by rules', out_of_scope: 'out of scope' };
const modelName = m => String(m || '').split('/').pop();
function scoreList(s) {
  if (Array.isArray(s)) return s.map(x => isObj(x) ? [x.label ?? x.name ?? x.option, num(x.score ?? x.p ?? x.prob ?? x.confidence) ?? 0] : [x, 0]);
  if (isObj(s)) return Object.entries(s).map(([k, v]) => [k, num(v) ?? 0]);
  return [];
}
const barRow = (k, p, on) => `<div><div class="flex justify-between gap-2 text-[13px]"><span class="truncate ${on ? 'font-semibold' : 'muted'}">${esc(String(k).replace(/_/g, ' '))}</span><span class="font-mono ${on ? '' : 'muted'}" data-count="${p}">0%</span></div>
  <div class="track mt-1" role="meter" aria-label="${esc(k)}" aria-valuemin="0" aria-valuemax="1" aria-valuenow="${p}"><div class="fill h-full rounded-full ${on ? 'bg-accent' : 'bg-zinc-400 dark:bg-zinc-600'}" style="width:0" data-w="${Math.max(0, Math.min(100, p * 100))}"></div></div></div>`;
// grow bars + count numbers inside el
function grow(el) {
  void el.offsetWidth; // commit width:0 so the transition runs
  $$('[data-w]', el).forEach(b => { b.style.width = b.dataset.w + '%'; });
  $$('[data-count]', el).forEach(n => {
    const to = Number(n.dataset.count), dur = 900 / S.speed, t0 = performance.now();
    if (RM) { n.textContent = pct(to); return; }
    (function f() { const k = Math.min(1, (performance.now() - t0) / dur); n.textContent = pct(to * (1 - Math.pow(1 - k, 3))); if (k < 1) setTimeout(f, 16); })();
  });
}
function addSec(title, right, body) {
  const d = document.createElement('div');
  d.className = 'sec rise';
  d.innerHTML = `<div class="sec-t"><span class="sec-head"><span class="step">step ${++S.step}</span><span class="sec-name">${title}</span></span><span class="normal-case tracking-normal">${right || ''}</span></div><div class="body">${body || ''}</div>`;
  $('#panel').appendChild(d);
  $('#panel').scrollTo({ top: $('#panel').scrollHeight, behavior: RM ? 'auto' : 'smooth' });
  return d;
}
function setStatus(t, done) {
  $('#status').innerHTML = done
    ? `<span class="text-accent-dim dark:text-accent">✓ ${esc(t)}</span>`
    : `<span class="pulse h-2 w-2 shrink-0 rounded-full bg-accent" aria-hidden="true"></span><span class="truncate">${esc(t)}</span>`;
}
const scrollChat = () => $('#chat').scrollTo({ top: $('#chat').scrollHeight, behavior: RM ? 'auto' : 'smooth' });

// ---------- the timeline ----------
async function run(c, g) {
  const d = isObj(c.decision) ? c.decision : {};
  const step = ms => wait(ms, g);
  $('#chat').innerHTML = ''; $('#panel').innerHTML = ''; $('#foot').innerHTML = ''; S.step = 0;
  $('#convTitle').textContent = c.title || c.id || 'Conversation';
  $('#convMeta').innerHTML = `<span class="badge b-gray">${esc(c.channel || '?')}</span><span class="text-[11px] muted">${S.idx + 1} / ${S.items.length}</span>`;
  setStatus('Customer is writing…');
  await step(350);

  // (a) customer bubble + photo
  const imgs = (c.customer?.images || []).map(safeUrl).filter(Boolean);
  $('#chat').insertAdjacentHTML('beforeend', `<div class="flex justify-end slide-l"><div class="bub-c"><div class="mb-1 text-[11px] font-semibold opacity-60">Customer${c.channel === 'email' ? ' · email' : ''}</div><div class="whitespace-pre-wrap break-words">${esc(c.customer?.text || '')}</div>${imgs.length ? `<div class="mt-2 flex flex-wrap gap-2">${imgs.map((u, i) => `<img src="${esc(u)}" alt="Customer photo ${i + 1}" class="pop h-40 max-w-full rounded-lg object-cover sm:h-48" style="animation-delay:calc(.35s * var(--k))">`).join('')}</div>` : ''}</div></div>`);
  scrollChat();
  await step(1300);

  // (b) decision sections
  const v = d.vision;
  if (isObj(v) && (v.label != null || v.scores)) {
    setStatus('Looking at the photo…'); await step(500);
    const rows = scoreList(v.scores).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const el = addSec('Sees', `<span class="badge w-vision font-mono">${esc(modelName(v.model) || 'Vision')}</span>`,
      `${v.label != null ? `<div class="mb-2 text-base font-semibold">${esc(String(v.label).replace(/_/g, ' '))}</div>` : ''}<div class="space-y-2">${rows.map(([k, p]) => barRow(k, p, k === v.label)).join('')}</div>`);
    grow(el); await step(1300);
  }

  const it = d.intent;
  if (isObj(it) && (it.subflow || it.flow)) {
    setStatus('Understanding the request…'); await step(450);
    const el = addSec('Understands', it.by ? `decided by ${byBadge(it.by)}` : '',
      `<div class="flex flex-wrap items-baseline gap-2"><span class="text-base font-semibold">${esc(String(it.subflow ?? it.flow).replace(/_/g, ' '))}</span>${it.flow && it.subflow ? `<span class="text-xs muted">${esc(String(it.flow).replace(/_/g, ' '))}</span>` : ''}${num(it.confidence) != null ? `<span class="ml-auto font-mono text-[13px]" data-count="${it.confidence}">0%</span>` : ''}</div>
      ${num(it.confidence) != null ? `<div class="track mt-1.5"><div class="fill h-full rounded-full bg-accent" style="width:0" data-w="${it.confidence * 100}"></div></div>` : ''}`);
    grow(el); await step(1100);
  }

  const fe = isObj(d.fields) ? Object.entries(d.fields).filter(([, z]) => { const x = isObj(z) ? z.value : z; return x != null && x !== ''; }) : [];
  if (fe.length) {
    setStatus('Pulling out details…'); await step(400);
    const el = addSec('Extracts', '', '<div class="flex flex-wrap gap-1.5"></div>');
    const box = $('.body > div', el);
    for (const [k, z] of fe) {
      const o = isObj(z) ? z : { value: z };
      box.insertAdjacentHTML('beforeend', `<span class="chip pop"><span class="font-semibold text-accent-dim dark:text-accent">${esc(k.toUpperCase())}</span><span class="truncate">${esc(short(o.value))}</span>${num(o.confidence) != null ? `<span class="muted">${pct(o.confidence)}</span>` : ''}${byBadge(o.by, 'field')}</span>`);
      await step(280);
    }
    await step(600);
  }

  const p = d.plan;
  if (isObj(p) && (p.status || (p.actions || []).length || (p.missing || []).length)) {
    setStatus('Checking store rules…'); await step(450);
    const m = isObj(p.matched) ? p.matched : null;
    const el = addSec('Rules', byBadge('code', 'rule'), `${m?.say ? `<div class="text-sm">${esc(m.say)}</div>` : ''}
      ${(p.missing || []).length ? `<div class="mt-1 flex flex-wrap items-center gap-1"><span class="text-xs muted">asks the customer for</span>${p.missing.map(z => `<span class="badge b-gray">${esc(String(z).replace(/\|/g, ' or '))}</span>`).join('')}</div>` : ''}
      ${(p.actions || []).length ? `<div class="mt-1.5 flex flex-wrap items-center gap-1 text-xs"><span class="muted">plan</span>${p.actions.map((a, i) => `${i ? '<span class="muted">→</span>' : ''}<span class="chip pop py-0.5 text-[11.5px]" style="animation-delay:calc(${0.15 * i + 0.3}s * var(--k))">${esc(a)}</span>`).join('')}</div>` : ''}`);
    await step(450);
    if (p.status) $('.sec-t > span:last-child', el).innerHTML = `<span class="flex items-center gap-1">${byBadge('code', 'rule')}<span class="badge pop ${planCls(p.status)}">${esc(PLAN_LABEL[p.status] || String(p.status).split('_').join(' '))}</span></span>`;
    await step(900);
  }

  const l = d.lookup;
  if (isObj(l) && (l.query || l.answer)) {
    setStatus('Looking it up…'); await step(400);
    addSec('Looks up', TAVILY, lookupHtml(l));
    await step(1300);
  }

  const tc = (Array.isArray(d.tool_calls) ? d.tool_calls : []).map(t => isObj(t) ? t : { action: t });
  if (tc.length) {
    setStatus('Taking actions…'); await step(400);
    const el = addSec('Acts', '', '<div class="space-y-2"></div>');
    const box = $('.body > div', el);
    for (const t of tc) {
      const r = t.result, msg = t.message ?? (isObj(r) ? (r.message ?? r.error) : r);
      const args = isObj(t.args) && Object.keys(t.args).length ? Object.entries(t.args).map(([k, x]) => `${k}=${short(x)}`).join(' · ') : '';
      const row = document.createElement('div');
      row.className = 'rise rounded-lg border border-l-4 border-zinc-200 border-l-sky-400 px-3 py-2 dark:border-zinc-800 dark:border-l-sky-400';
      row.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-2"><span class="flex items-center gap-1.5"><span class="font-mono text-sm font-semibold">${esc(t.action ?? t.name ?? 'tool')}</span>${byBadge(t.by)}</span><span class="st flex items-center gap-1.5"><span class="badge b-gray pulse">calling…</span></span></div>
        ${args ? `<div class="mt-1 truncate font-mono text-[11.5px] muted">${esc(args)}</div>` : ''}${msg != null && msg !== '' ? `<div class="mt-0.5 truncate text-xs muted">${esc(short(msg))}</div>` : ''}`;
      box.appendChild(row);
      $('#panel').scrollTo({ top: $('#panel').scrollHeight, behavior: RM ? 'auto' : 'smooth' });
      await step(380);
      $('.st', row).innerHTML = (t.ok !== false ? '<span class="badge pop b-green">✓ CALLED</span>' : '<span class="badge pop b-red">✗ FAILED</span>')
        + (num(t.confidence) != null ? `<span class="font-mono text-[11px] muted">${pct(t.confidence)}</span>` : '');
      await step(300);
    }
    await step(500);
  }

  // (c) writer + reply typed word by word
  const reply = c.agent?.reply;
  if (d.writer || reply) {
    setStatus('Writing the reply…'); await step(350);
    if (d.writer) addSec('Writer', '', (d.writer === 'none' ? '<span class="text-sm">ready-made reply, no model needed</span>' : `<span class="text-sm">written by</span> ${byBadge(d.writer)}`));
  }
  if (reply) {
    const wrap = document.createElement('div');
    wrap.className = 'flex justify-start slide-r';
    wrap.innerHTML = `<div class="bub-a"><div class="mb-1 flex items-center gap-2 text-[11px] font-semibold"><span class="h-2 w-2 rounded-full bg-accent" aria-hidden="true"></span>Trailhead agent</div><div class="txt caret whitespace-pre-wrap break-words"><span class="pulse muted">typing…</span></div></div>`;
    $('#chat').appendChild(wrap); scrollChat();
    await step(600);
    const txt = $('.txt', wrap), parts = String(reply).split(/(\s+)/);
    if (RM) txt.textContent = reply;
    else {
      txt.textContent = '';
      const words = parts.filter(w => w.trim()).length, per = Math.min(90, 3600 / Math.max(1, words));
      for (const w of parts) { txt.append(w); if (w.trim()) { await step(per); scrollChat(); } }
    }
    txt.classList.remove('caret');
    await step(300);
  }

  const sf = d.safety;
  if (isObj(sf)) {
    setStatus('Safety check…'); await step(350);
    const ok = sf.ok !== false && !(sf.issues || []).length;
    const el = addSec('Safety', '', '<span class="badge b-gray pulse">checking…</span>');
    await step(500);
    $('.body', el).innerHTML = ok ? '<span class="badge pop b-green">✓ passed</span>'
      : `<span class="badge pop b-red">issues</span><ul class="mt-1 list-disc pl-5 text-xs">${(sf.issues || []).map(z => `<li>${esc(short(z))}</li>`).join('')}</ul>`;
    await step(400);
  }

  // (d) footer
  const cost = money(c.cost_usd), lat = num(c.latency_s);
  const bits = [cost && `<span class="font-semibold text-accent-dim dark:text-accent">${cost}</span>`, lat != null && `answered in ${lat.toFixed(1)} s`].filter(Boolean);
  $('#foot').innerHTML = bits.length ? `<span class="pop">${bits.join(' <span class="muted">·</span> ')}</span>` : '';
  setStatus('Done', true);
}

// ---------- play control ----------
function paintPlay() {
  const playing = !S.paused && !S.done;
  $('#playBtn').innerHTML = playing
    ? '<svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause'
    : '<svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Play';
  $('#playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  document.body.classList.toggle('paused', S.paused);
}
async function play() {
  const g = ++S.gen, c = S.items[S.idx];
  S.paused = false; S.done = false; paintPlay();
  $('#convSel').value = String(S.idx);
  if (!c) { $('#chat').innerHTML = '<div class="py-10 text-center text-sm muted">No conversations match.</div>'; $('#panel').innerHTML = ''; $('#foot').innerHTML = ''; $('#status').innerHTML = ''; S.done = true; paintPlay(); return; }
  try {
    await run(c, g);
    if (S.auto && S.items.length) {
      await (RM ? new Promise((ok, bad) => setTimeout(() => g === S.gen ? ok() : bad(STOP), 5000)) : wait(2800, g));
      S.idx = (S.idx + 1) % S.items.length;
      if (KIOSK && !S.idx) pick3();
      play(); return;
    }
    S.done = true; paintPlay();
  } catch (e) { if (e !== STOP) throw e; }
}
const go = d => { if (!S.items.length) return; S.idx = (S.idx + d + S.items.length) % S.items.length; play(); };
$('#playBtn').addEventListener('click', () => { if (S.done) play(); else { S.paused = !S.paused; paintPlay(); } });
$('#restartBtn').addEventListener('click', play);
$('#prevBtn').addEventListener('click', () => go(-1));
$('#nextBtn').addEventListener('click', () => go(1));
$('#convSel').addEventListener('change', e => { S.idx = Number(e.target.value); play(); });
$('#chanSel').addEventListener('change', () => { filter(); play(); });
$('#runSel').addEventListener('change', e => loadRun(e.target.value));
$('#autoIn').checked = S.auto;
$('#autoIn').addEventListener('change', e => { S.auto = e.target.checked; if (S.auto && S.done) go(1); });
function setSpeed(n) {
  S.speed = n; document.body.style.setProperty('--k', 1 / n);
  $$('[data-speed]').forEach(b => { const on = Number(b.dataset.speed) === n; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
$$('[data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
document.addEventListener('keydown', e => {
  if (e.target.closest('select, input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); $('#playBtn').click(); }
  else if (k === 'ArrowRight') go(1);
  else if (k === 'ArrowLeft') go(-1);
  else if (k === 'r' || k === 'R') play();
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === '1' || k === '2') setSpeed(Number(k));
});

// ---------- data ----------
function pick3() {
  const a = [...(S.data?.items || [])];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  S.items = a.slice(0, 3); S.idx = 0;
}
function filter() {
  const ch = $('#chanSel').value, cur = S.items[S.idx]?.id;
  S.items = (S.data?.items || []).filter(c => !ch || c.channel === ch);
  $('#convSel').innerHTML = S.items.map((c, i) => `<option value="${i}">${i + 1}. ${esc(c.title || c.id)} · ${esc(c.channel || '?')}</option>`).join('') || '<option>—</option>';
  S.idx = Math.max(0, S.items.findIndex(c => c.id === cur));
}
async function loadRun(run) {
  S.gen++; setStatus('Loading…');
  try {
    if (DEMO) S.data = MOCK;
    else {
      const rk = store.get('rk');
      const res = await fetch('/api/conversations' + (run ? '?run=' + encodeURIComponent(run) : ''), { headers: rk ? { Authorization: 'Bearer ' + rk } : {} });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j?.error?.message || (typeof j?.detail === 'string' ? j.detail : '') || 'HTTP ' + res.status);
      S.data = j;
    }
  } catch (e) {
    if (run && !Q.get('run')) return loadRun(''); // default run missing: let the server pick
    $('#status').innerHTML = ''; $('#chat').innerHTML = `<div role="alert" class="rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-500/40 dark:bg-red-950/60 dark:text-red-200">Could not load conversations: ${esc(e.message)}</div>`;
    return;
  }
  const runs = S.data.runs || (S.data.run ? [S.data.run] : []);
  $('#runSel').innerHTML = runs.map(r => `<option ${r === S.data.run ? 'selected' : ''}>${esc(r)}</option>`).join('') || '<option>—</option>';
  S.idx = 0; S.items = [];
  filter();
  const want = Q.get('id'); if (want) S.idx = Math.max(0, S.items.findIndex(c => c.id === want));
  if (KIOSK) pick3();
  play();
}

// ---------- ?demo=1 mock ----------

        { action: 'create-replacement', args: { order_id: '4820193746', return_required: false }, ok: true, result: { message: 'replacement R-55812 created' }, confidence: 0.93 }],

      intent: { subflow: 'boots', flow: 'single_item_query', confidence: 0.96, by: 'nano' },

      plan: { status: 'ok', missing: [], actions: ['search-faq', 'search-boots', 'select-faq'], matched: null },

        { action: 'search-boots', args: {}, ok: true, result: { message: 'System Action: search boots' } },
        { action: 'select-faq', args: { id: 'boots_how_2' }, ok: true, result: { message: 'how wide is the shoe' } }],

setSpeed(1); paintPlay();
loadRun(Q.get('run') || (DEMO ? '' : '20261028-photos-fast'));
</script>
