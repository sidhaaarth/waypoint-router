<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/brand/waypoint-mark-64.png">
<title>Live Chat</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t === 'light') document.documentElement.classList.remove('dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] },
      colors: { accent: { DEFAULT: '#76b900', soft: '#8fd400', dim: '#5a8f00' } }
    } }
  };
</script>
<style type="text/tailwindcss">
  @layer components {
    .card { @apply rounded-xl border border-zinc-200 bg-white shadow-sm dark:border-zinc-800 dark:bg-zinc-900/70 dark:shadow-none; }
    .card-h { @apply flex items-center justify-between gap-3 border-b border-zinc-200 px-4 py-3 dark:border-zinc-800; }
    .card-t { @apply text-sm font-semibold text-zinc-900 dark:text-zinc-100; }
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm font-medium text-zinc-800 transition hover:bg-zinc-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:hover:bg-zinc-800; }
    .btn-primary { @apply border-accent bg-accent text-zinc-950 hover:bg-accent-soft dark:border-accent dark:bg-accent dark:text-zinc-950 dark:hover:bg-accent-soft; }
    .btn-sm { @apply px-2 py-1 text-xs; }
    .input { @apply w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 placeholder-zinc-400 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-100 dark:placeholder-zinc-600; }
    .label { @apply mb-1 block text-xs font-medium text-zinc-600 dark:text-zinc-400; }
    .muted { @apply text-zinc-500 dark:text-zinc-400; }
    .badge { @apply inline-flex items-center gap-1 whitespace-nowrap rounded-md border px-1.5 py-0.5 text-[11px] font-medium leading-4; }
    .b-gray { @apply border-zinc-300 bg-zinc-100 text-zinc-700 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-300; }
    .b-amber { @apply border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300; }
    .b-red { @apply border-red-300 bg-red-50 text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300; }
    .b-green { @apply border-lime-300 bg-lime-50 text-lime-800 dark:border-accent/30 dark:bg-accent/10 dark:text-accent-soft; }
    .b-violet { @apply border-violet-300 bg-violet-50 text-violet-800 dark:border-violet-400/30 dark:bg-violet-400/10 dark:text-violet-300; }
    .b-sky { @apply border-sky-300 bg-sky-50 text-sky-800 dark:border-sky-400/30 dark:bg-sky-400/10 dark:text-sky-300; }
    .seg { @apply inline-flex rounded-lg border border-zinc-300 p-0.5 dark:border-zinc-700; }
    .seg button { @apply rounded-md px-2.5 py-1 text-xs font-medium text-zinc-600 dark:text-zinc-400; }
    .seg button.on { @apply bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900; }
    .sec { @apply border-b border-zinc-200 px-4 py-3 last:border-b-0 dark:border-zinc-800; }
    .sec-head { display: inline-flex; align-items: center; gap: 10px; }
    .sec-name { font-size: 13px; font-weight: 800; letter-spacing: .09em; color: #18181b; line-height: 1;
                text-decoration: underline; text-decoration-color: #76b900; text-decoration-thickness: 2px;
                text-underline-offset: 3px; }
    .dark .sec-name { color: #f4f4f5; }
    .sec-t { @apply mb-2 flex items-center justify-between gap-2 text-[11px] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400; }
    .chip { @apply inline-flex max-w-full items-center gap-1.5 rounded-md border border-zinc-300 bg-zinc-50 px-2 py-1 font-mono text-[12px] dark:border-zinc-700 dark:bg-zinc-950; }
    .bub-c { @apply max-w-[85%] rounded-2xl rounded-br-md bg-zinc-900 px-4 py-3 text-sm text-white dark:bg-zinc-100 dark:text-zinc-900; }
    .bub-a { @apply max-w-[85%] rounded-2xl rounded-bl-md border border-zinc-200 bg-white px-4 py-3 text-sm text-zinc-900 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-100; }
    .code { @apply overflow-x-auto rounded-md border border-zinc-200 bg-zinc-50 px-2 py-1.5 font-mono text-[11.5px] leading-relaxed text-zinc-800 dark:border-zinc-800 dark:bg-black/40 dark:text-zinc-200; }
    .empty { @apply flex flex-col items-center justify-center gap-1 px-4 py-10 text-center text-sm text-zinc-500 dark:text-zinc-400; }
    /* who did the work: same palette in replay.html */
    .w-nano { @apply border-lime-300 bg-lime-50 text-lime-800 dark:border-accent/30 dark:bg-accent/10 dark:text-accent-soft; }
    .w-super { @apply border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-400/30 dark:bg-amber-400/10 dark:text-amber-300; }
    .w-ultra { @apply border-violet-300 bg-violet-50 text-violet-800 dark:border-violet-400/30 dark:bg-violet-400/10 dark:text-violet-300; }
    .w-vision { @apply border-pink-300 bg-pink-50 text-pink-800 dark:border-pink-400/30 dark:bg-pink-400/10 dark:text-pink-300; }
    .w-rules { @apply border-blue-300 bg-blue-50 text-blue-800 dark:border-blue-400/30 dark:bg-blue-400/10 dark:text-blue-300; }
    .w-store { @apply border-sky-300 bg-sky-50 text-sky-800 dark:border-sky-400/30 dark:bg-sky-400/10 dark:text-sky-300; }
    .legend { @apply flex flex-wrap gap-x-3 gap-y-1 border-b border-zinc-200 px-4 py-2 text-[11px] text-zinc-500 dark:border-zinc-800 dark:text-zinc-400; }
    .legend > span { @apply inline-flex items-center gap-1.5; }
    .step { @apply rounded bg-zinc-200 px-1 font-mono text-[10px] font-medium normal-case tracking-normal text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400; }
  }
  .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 9999px; background: currentColor !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } }
  .rise { animation: rise .4s ease-out both; }
  /* reply/customer bubbles: rise from below, blurred -> sharp */
  @keyframes blur-rise { from { opacity: 0; transform: translateY(16px); filter: blur(6px) } }
  .enter { animation: blur-rise .5s ease-out both; }
  .enter-fast { animation-duration: .25s; }
  @keyframes tdot { 0%,80%,100% { opacity: .3; transform: translateY(0) } 40% { opacity: 1; transform: translateY(-3px) } }
  .tdot { display: inline-block; width: .4rem; height: .4rem; margin: 0 .1rem; border-radius: 9999px; background: currentColor; animation: tdot 1.2s ease-in-out infinite; }
  .tdot:nth-child(2) { animation-delay: .15s } .tdot:nth-child(3) { animation-delay: .3s }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  [hidden] { display: none !important; }
  body { font-feature-settings: "cv11", "ss01"; }
  :focus-visible { outline: 2px solid #76b900; outline-offset: 2px; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  @keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .pulse { animation: pulse-dot 1.4s ease-in-out infinite; }
  @media (min-width: 1024px) { .pane { height: calc(100vh - 7.5rem); overflow-y: auto; } }
  /* analytics (Decision Flow) is off by default: chat full width; on -> panel slides in on the right, or a bottom sheet on phones */
  #anPanel, .an-meta { display: none; }
  .an-on #anPanel { display: block; animation: an-in .3s ease-out both; }
  .an-on .an-meta { display: block; }
  .an-on [data-turn] .bub-a { cursor: pointer; }
  @keyframes an-in { from { opacity: 0; transform: translateX(24px) } }
  @keyframes an-up { from { transform: translateY(100%) } }
  @media (min-width: 1024px) { #view-live.an-on { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 1rem; } }
  @media (max-width: 1023px) {
    .an-on #anPanel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 75vh; overflow-y: auto; border-radius: 1rem 1rem 0 0; animation-name: an-up; box-shadow: 0 -8px 30px rgba(0,0,0,.35); background: #fff; }
    html.dark .an-on #anPanel { background: #18181b; }
  }
  #anBtn[aria-pressed="true"] { box-shadow: 0 0 0 2px rgba(118, 185, 0, .45); }
  .turn > summary { list-style: none; }
  .turn > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-block; transition: transform .15s; }
  .turn[open] .chev { transform: rotate(90deg); }
  .hl .bub-a { outline: 2px solid #76b900; outline-offset: 3px; }
</style>
<style id="light-contrast">
/* Light theme: crisper edges. The zinc-200 borders nearly vanished on the near-white page. Dark theme untouched. */
html:not(.dark) body { background-color: #eceff3; }
html:not(.dark) .card { border-color: #b6bec9; box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 1px 1px rgba(16, 24, 40, .04); }
html:not(.dark) .card-h,
html:not(.dark) .border-zinc-200, html:not(.dark) .border-gray-200, html:not(.dark) .border-slate-200 { border-color: #c3cad3; }
html:not(.dark) .btn:not(.btn-primary), html:not(.dark) .input,
html:not(.dark) .border-zinc-300, html:not(.dark) .border-gray-300, html:not(.dark) .border-slate-300 { border-color: #a7afba; }
html:not(.dark) .b-gray { border-color: #b6bec9; }
</style>
</head>
<body class="bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">

<header class="sticky top-0 z-30 border-b border-zinc-200 bg-white/80 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/80">
  <div class="mx-auto flex max-w-[1600px] flex-wrap items-center gap-3 px-4 py-3">
    <div class="flex min-w-0 items-center gap-2">
      <a href="/dashboard" class="btn btn-sm shrink-0" aria-label="Back to dashboard" title="Back to dashboard">←</a>
      <span class="grid h-7 w-7 shrink-0 place-items-center rounded-md bg-accent text-zinc-950" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg>
      </span>
      <span class="min-w-0">
        <span id="storeName" class="block truncate text-sm font-semibold">Live chat</span>
        <span class="block truncate text-[11px] muted">Try your connections as a customer would</span>
      </span>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <span id="demoBadge" class="hidden badge b-amber">demo data</span>
      <button id="themeBtn" class="btn btn-sm" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-[1600px] px-4 py-4">
  <!-- B) live chat -->
  <section id="view-live" class="min-w-0">
    <div class="card flex min-w-0 flex-col pane">
      <div class="card-h">
        <span class="card-t">Chat as a customer</span>
        <div class="flex items-center gap-2">
          <button id="newConv" class="btn btn-sm">New conversation</button>
          <button id="setBtn" class="btn btn-sm" aria-expanded="false" aria-controls="settings">Settings</button>
          <button id="anBtn" class="btn btn-sm btn-primary" aria-pressed="false" aria-controls="anPanel">Analytics</button>
        </div>
      </div>
      <div id="settings" class="hidden grid gap-3 border-b border-zinc-200 px-4 py-3 dark:border-zinc-800 sm:grid-cols-3">
        <div><label class="label" for="rkIn">Router key</label><input id="rkIn" class="input font-mono" placeholder="rk-..." autocomplete="off" spellcheck="false"></div>
        <div><label class="label" for="routeIn">Route name</label><input id="routeIn" class="input" value="support"></div>
        <div><label class="label" for="liveChan">Channel</label>
          <select id="liveChan" class="input"><option value="chat">chat (keeps history)</option><option value="email">email (one message)</option></select></div>
      </div>
      <div id="liveChat" class="min-w-0 flex-1 space-y-4 overflow-y-auto p-4" aria-live="polite"></div>
      <style>
        /* One focus outline for the whole composer (text + Photo + Send), not a second one on the textarea.
           While typing, the writing area grows to roughly the lower third of the chat. */
        #msgIn, #msgIn:focus, #msgIn:focus-visible { outline: none !important; box-shadow: none !important; }
        #msgIn { height: 3.25rem; transition: height .2s ease; }
        #dropZone:focus-within #msgIn { height: min(34vh, 18rem); }
        #dropZone:focus-within { border-color: #76b900; box-shadow: 0 0 0 2px rgba(118, 185, 0, .35); }
        @media (prefers-reduced-motion: reduce) { #msgIn { transition: none; } }
      </style>
      <form id="liveForm" class="border-t border-zinc-200 p-3 dark:border-zinc-800">
        <div id="dropZone" class="rounded-xl border border-zinc-300 bg-white transition focus-within:border-accent focus-within:ring-2 focus-within:ring-accent/30 dark:border-zinc-700 dark:bg-zinc-950">
          <div id="preview" class="hidden flex items-center gap-2 px-3 pt-3"></div>
          <label class="sr-only" for="msgIn">Message</label>
          <textarea id="msgIn" rows="2" class="block w-full resize-none rounded-xl bg-transparent px-3 py-2 text-sm outline-none placeholder-zinc-400 dark:placeholder-zinc-600" placeholder="Write as the customer… paste or drop a photo"></textarea>
          <div class="flex items-center justify-between gap-2 px-2 pb-2">
            <label class="btn btn-sm cursor-pointer focus-within:ring-2 focus-within:ring-accent" title="Attach photo">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15l-5-5L5 21"/><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
              Photo<input id="fileIn" type="file" accept="image/*" class="sr-only" aria-label="Attach photo">
            </label>
            <button id="sendBtn" type="submit" class="btn btn-primary btn-sm px-4">Send</button>
          </div>
        </div>
      </form>
    </div>
    <aside id="anPanel" class="card min-w-0 pane" aria-label="Decision Flow">
      <div class="card-h"><span class="card-t shrink-0">Decision Flow</span><span class="flex flex-wrap items-center justify-end gap-1"><span id="liveHdr" class="contents"></span><button id="anClose" class="btn btn-sm lg:hidden" aria-label="Close analytics">Close</button></span></div>
      <div class="legend" role="group" aria-label="Color legend: who did the work"><span><i class="dot w-nano" aria-hidden="true"></i>Nano</span><span><i class="dot w-super" aria-hidden="true"></i>Super</span><span><i class="dot w-ultra" aria-hidden="true"></i>Ultra</span><span><i class="dot w-vision" aria-hidden="true"></i>Vision (Super-VL)</span><span><i class="dot w-rules" aria-hidden="true"></i>Rules engine &amp; exact match</span><span><i class="dot w-store" aria-hidden="true"></i>Store record</span></div>
      <div id="anStatus"><div class="empty">Send a message to see the decision.</div></div>
      <div id="turns"></div>
    </aside>
  </section>
</main>

<dialog id="imgDlg" class="max-h-[90vh] max-w-[95vw] rounded-xl bg-transparent p-0">
  <form method="dialog" class="relative">
    <img id="imgBig" alt="Customer photo, enlarged" class="max-h-[85vh] max-w-[95vw] rounded-xl">
    <button class="btn btn-sm absolute right-2 top-2" aria-label="Close image">Close</button>
  </form>
</dialog>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v != null) return v; } catch (e) {} return k in mem ? mem[k] : null; },
  set(k, v) { if (v == null) delete mem[k]; else mem[k] = v; try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function money(v) {
  v = num(v); if (v == null) return '—';
  const a = Math.abs(v); if (a === 0) return '$0.00';
  if (a < 0.01) return '$' + a.toFixed(Math.min(10, 2 - Math.floor(Math.log10(a)))).replace(/0+$/, '');
  return '$' + a.toFixed(4);
}
const pct = v => num(v) == null ? '—' : Math.round(Number(v) * 100) + '%';
const secs = v => num(v) == null ? '—' : Number(v).toFixed(1) + ' s';
const short = v => typeof v === 'string' ? v : JSON.stringify(v);

// ---------- theme ----------
const isDark = () => document.documentElement.classList.contains('dark');
function paintTheme() {
  $('#themeBtn').innerHTML = isDark()
    ? '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
}
$('#themeBtn').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); store.set('theme', isDark() ? 'dark' : 'light'); paintTheme(); });
paintTheme();
if (DEMO) $('#demoBadge').classList.remove('hidden');

// ---------- image dialog ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-zoom]'); if (!b) return;
  $('#imgBig').src = b.dataset.zoom; $('#imgDlg').showModal();
});
$('#imgDlg').addEventListener('click', e => { if (e.target.id === 'imgDlg') e.target.close(); });

// ---------- bubbles ----------
const thumbs = imgs => (imgs || []).length ? `<div class="mt-2 flex flex-wrap gap-2">${imgs.map((u, i) =>
  `<button type="button" data-zoom="${esc(u)}" class="overflow-hidden rounded-lg border border-white/20" aria-label="Enlarge photo ${i + 1}"><img src="${esc(u)}" alt="Customer photo ${i + 1}" class="h-24 w-24 object-cover"></button>`).join('')}</div>` : '';
const custBubble = (text, imgs) => `<div class="enter enter-fast flex justify-end"><div class="bub-c"><div class="mb-1 text-[11px] font-semibold opacity-60">Customer</div><div class="whitespace-pre-wrap break-words">${esc(text || '')}</div>${thumbs(imgs)}</div></div>`;
// meta (writer · cost · latency) only shows while analytics is on (.an-on .an-meta)
const agentBubble = (reply, meta, n) => `<div class="enter flex flex-col items-start"${n ? ` data-turn="${n}"` : ''}><div class="bub-a"><div class="mb-1 flex items-center gap-2 text-[11px] font-semibold"><span class="h-2 w-2 rounded-full bg-accent" aria-hidden="true"></span>Trailhead agent</div>${
  reply == null ? '<div class="italic muted">not run yet</div>' : `<div class="whitespace-pre-wrap break-words">${esc(reply)}</div>`}</div>${meta ? `<div class="an-meta mt-1 pl-1 text-[11px] muted">${esc(meta)}</div>` : ''}</div>`;
const errBubble = msg => `<div role="alert" class="rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-500/40 dark:bg-red-950/60 dark:text-red-200">${esc(msg)}</div>`;

// ---------- decision panel ----------
// sections fade in one by one, in pipeline order; staggerPanel() sets the delays (reduced-motion shows all at once)
let stepN = 0;
const sec = (title, body, right = '') => { const n = ++stepN; return `<div class="sec rise"><div class="sec-t"><span class="sec-head"><span class="step">step ${n}</span><span class="sec-name">${title}</span></span>${right}</div>${body}</div>`; };
const none = '<div class="text-xs muted">—</div>';
// who did the work -> [color class, label]; same block in replay.html
const WHO = { nano: ['w-nano', 'Nano'], super: ['w-super', 'Super'], ultra: ['w-ultra', 'Ultra'], vision: ['w-vision', 'Vision'], code: ['w-rules', 'Rules engine'], store: ['w-store', 'Store record'] };
function whoKey(b) {
  const s = String(b || '').toLowerCase();
  if (s === 'code' || s === 'regex' || s === 'rules') return 'code';
  if (s === 'store') return 'store';
  if (/vl\b|vision/.test(s)) return 'vision';
  for (const k of ['ultra', 'super', 'nano']) if (s.includes(k)) return k;
  return s === 'vote' ? 'nano' : null;
}
function byLabel(b, ctx) {
  const k = whoKey(b);
  if (k === 'code' && ctx === 'field') return 'Exact match';
  if (/vote/i.test(b)) return 'Nano ×3 vote';
  if (/x3/i.test(b)) return 'Nano ×3 drafts + merge';
  return k ? WHO[k][1] : String(b);
}
const byBadge = (b, ctx) => b ? `<span class="badge font-sans ${WHO[whoKey(b)]?.[0] || 'b-gray'}">${esc(byLabel(b, ctx))}</span>` : '';

function scoreList(s) {
  if (Array.isArray(s)) return s.map(x => isObj(x) ? [x.label ?? x.name ?? x.option, num(x.score ?? x.p ?? x.prob ?? x.confidence) ?? 0] : [x, 0]);
  if (isObj(s)) return Object.entries(s).map(([k, v]) => [k, num(v) ?? 0]);
  return [];
}
function bars(scores, chosen) {
  const rows = scoreList(scores).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '';
  return `<div class="space-y-1.5">${rows.map(([k, p]) => {

const MAX_BYTES = 4 * 1024 * 1024;
function toDataURL(file) {
  return new Promise((ok, bad) => {
    if (!file || !/^image\//.test(file.type)) return bad(new Error('Only image files can be attached'));
    if (file.size > 25 * MAX_BYTES) return bad(new Error('Image is too large'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      const d = cv.toDataURL('image/jpeg', 0.85);
      d.length * 0.75 > MAX_BYTES ? bad(new Error('Image is over 4 MB even after resizing')) : ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); bad(new Error('Could not read that image')); };
    im.src = url;
  });
}
