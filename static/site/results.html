<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/brand/waypoint-mark-64.png">
<title>Router Results</title>
<meta name="description" content="What Waypoint delivers: near-Super answers for a fraction of the price, and exact details every time.">
<script src="/site/site.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = TW;</script>
</head>
<body class="bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
<main class="mx-auto max-w-6xl px-4">
  <section class="py-12 md:py-16">
    <div class="flex items-center gap-3 md:gap-4"><span class="shrink-0 text-4xl leading-none md:text-5xl" aria-hidden="true">📊</span><div class="min-w-0"><h1 class="text-3xl font-semibold tracking-tight md:text-4xl">Results</h1></div></div>
    <p class="mt-3 max-w-3xl text-base muted">Nemotron Nano does most of the work. Super and Ultra step in only when a message needs them, and plain code handles anything that has to be exact.</p>
  </section>
  <div id="box" class="space-y-6"><div class="card h-48 animate-pulse"></div><div class="card h-48 animate-pulse"></div></div>
</main>
<script>
const TIER = { nano: '#76b900', super: '#f59e0b', ultra: '#a78bfa', router: '#38bdf8', code: '#71717a' };
// $ per 1M tokens (input / output), from app/costs.py DEFAULT_PRICES
const PRICE = { nano: '$0.06 / $0.24', super: '$0.30 / $0.90', ultra: '$1.00 / $3.00' };
const card = (title, sub, take, body) => `<section class="card min-w-0"><div class="card-h"><span class="card-t">${title}</span>${sub ? `<span class="truncate text-xs muted">${sub}</span>` : ''}</div>
  <div class="p-4">${take ? `<p class="mb-4 text-sm">${take}</p>` : ''}${body}</div></section>`;
const bar = (v, color) => `<div class="flex items-center gap-2"><div class="h-1.5 w-12 flex-1 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800"><div class="h-full rounded-full" style="width:${v == null ? 0 : Math.max(0, Math.min(100, v * 100))}%;background:${color}"></div></div><span class="w-10 text-right text-xs tabular-nums">${pctF(v)}</span></div>`;
const dot = c => `<span class="mr-2 inline-block h-2 w-2 rounded-full" style="background:${c}"></span>`;
const LABEL = { customer_name: 'Customer name', email: 'Email', username: 'Username', order_id: 'Order number', zip_code: 'ZIP code', account_id: 'Account ID', phone: 'Phone' };

bench().then(d => {
  const out = [], cl = d.classification || {}, cls = cl.classification || {}, ex = cl.extraction || {};

  // (a) accuracy and cost: each model alone vs Waypoint (Nano + memory, Super when unsure)
  const r = cl.router;
  if (r) {
    const row = (name, o, price, bold) => { const w = s => bold ? `<b>${s}</b>` : s; return `<tr>${[name, price, w(money((num(o.cost_per_1k) || 0))), w(pctF(o.acc))]
      .map((c, i) => `<td class="td${i ? ' text-right tabular-nums' : ''}">${c}</td>`).join('')}</tr>`; };
    const less = o => pctF(1 - r.cost_per_1k / o.cost_per_1k);
    const sm = r.super_mem_only;
    out.push(card('More accurate than Super, for a fraction of the cost', '',
      `Before Nano answers, Waypoint shows it the three most similar past cases from your own history, with how each was handled. That lifts Nano from <b>${pctF(r.nano_only.acc)}</b> to <b>${pctF((r.nano_mem_only || {}).acc)}</b> on 600 real support messages. Nano handles <b>${pctF(r.on_nano)}</b> of them; Super steps in only when Nano isn't sure.`,
      `<div class="overflow-x-auto"><table class="tbl"><thead><tr><th class="th">Model</th><th class="th text-right">List price per 1M tokens (in / out)</th><th class="th text-right">Cost per 1,000 messages</th><th class="th text-right">Accuracy</th></tr></thead><tbody>
      ${row(`${dot(TIER.nano)}Nano alone`, r.nano_only, PRICE.nano)}
      ${row(`${dot(TIER.super)}Super alone`, r.super_only, PRICE.super)}
      ${row(`${dot(TIER.ultra)}Ultra alone`, r.ultra_only, PRICE.ultra)}
      ${row(`${dot(TIER.router)}<b>Waypoint</b> <span class="muted">(Nano → Super, both with memory)</span>`, r, `<span class="muted">${less(r.super_only)} less than Super</span>`, true)}
      </tbody></table></div>
      <p class="mt-3 text-sm muted">${sm ? `For a fair comparison: Super given the same memory scores ${pctF(sm.acc)} at ${money(sm.cost_per_1k)} per 1,000 messages, so Waypoint gets within ${Math.round((sm.acc - r.acc) * 100)} point${Math.round((sm.acc - r.acc) * 100) === 1 ? '' : 's'} of it for ${less(sm)} less. ` : ''}Messages from four public support datasets (shop orders, banking, general customer service, IT tickets), 150 each; accuracy is on the half not used for tuning.</p>`));
  }

  // (b) exact details: code vs Nano per field
  const fields = Object.keys(ex);
  if (fields.length) {
    out.push(card('Exact where it matters', 'who pulls out each detail',
      'Order numbers, emails and phone numbers are copied by plain code: exact every time, at no model cost. Nano reads what code can’t, like names and usernames. Each detail goes to whichever does it best.',
      `<div class="overflow-x-auto"><table class="tbl"><thead><tr><th class="th">Detail</th><th class="th min-w-[7rem]">${dot(TIER.code)}Code</th><th class="th min-w-[7rem]">${dot(TIER.nano)}Nano</th></tr></thead><tbody>
      ${fields.map(f => { const r = ex[f], k = num(r.n); return `<tr><td class="td">${esc(LABEL[f] || f.replace(/_/g, ' '))}</td><td class="td">${bar(k ? r.code / k : null, TIER.code)}</td><td class="td">${bar(k ? r.nano / k : null, TIER.nano)}</td></tr>`; }).join('')}
      </tbody></table></div>`));
  }

  $('#box').innerHTML = out.join('') || '<section class="card p-5 text-sm muted">Results are not available right now.</section>';
});
</script>
</body>
</html>
